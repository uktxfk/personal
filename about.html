  <script>
    const name = document.querySelector("#name");

    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      name.addEventListener("pointermove", (event) => {
        const bounds = name.getBoundingClientRect();
        name.style.setProperty("--pointer-x", `${event.clientX - bounds.left}px`);
        name.style.setProperty("--pointer-y", `${event.clientY - bounds.top}px`);
      });
      name.addEventListener("pointerenter", () => name.classList.add("is-hovered"));
      name.addEventListener("pointerleave", () => name.classList.remove("is-hovered"));
    }
  </script>
